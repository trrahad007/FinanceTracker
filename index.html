<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Finance Tracker — Rahad & Shammi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{min-height:100%;}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#f0f4fb;color:#0f172a;-webkit-font-smoothing:antialiased;}
input,select,textarea,button{font-family:inherit;}
button{cursor:pointer;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:#f1f5f9;}
::-webkit-scrollbar-thumb{background:#c7d2e1;border-radius:4px;}
.sidebar{position:fixed;top:0;left:-224px;width:224px;height:100vh;background:#111827;z-index:200;transition:left .22s ease;display:flex;flex-direction:column;overflow-y:auto;}
.main{margin-left:0;display:flex;flex-direction:column;min-height:100vh;transition:margin-left .22s ease;}
@media(min-width:768px){
  .sidebar{left:0!important;}
  .main{margin-left:224px!important;}
  .mob-btn{display:none!important;}
}
@media(max-width:767px){.mob-btn{display:flex!important;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useMemo}=React;

// ═══ STORAGE ════════════════════════════════════════════════
const SK='ft_tazwaar_v1';
function load(){try{const r=localStorage.getItem(SK);return r?JSON.parse(r):null;}catch{return null;}}
function save(s){try{localStorage.setItem(SK,JSON.stringify(s));}catch{}}

// ═══ AGREEMENT ══════════════════════════════════════════════
const AGR={principal:400000,interest:14000,deadline:15,lender:'Rahad',borrower:'Shammi'};

function genSchedule(){
  const rows=[];let y=2026,m=8,id=1;
  while(y<2028||(y===2028&&m<=8)){
    const due=new Date(y,m,AGR.deadline);
    rows.push({id:`p${id++}`,year:y,month:m,dueDate:due.toISOString().slice(0,10),expectedAmount:AGR.interest,submission:null});
    m++;if(m>11){m=0;y++;}
  }
  return rows;
}

const DEFAULT_BANK={
  accountName:'Tazwaar',bankName:'Dutch-Bangla Bank Limited',
  accountNumber:'1234567890',branchName:'Gulshan Branch',
  routingNumber:'090261234',mobileNumber:'01712-345678',
  note:'Please mention your name and payment month in the transfer description.',
};

function initState(){
  const s=load();
  if(s&&s.payments&&s.payments.length>0)return s;
  return{payments:genSchedule(),bank:DEFAULT_BANK};
}

// ═══ HELPERS ════════════════════════════════════════════════
function fmtDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function fmtTaka(n){return'৳'+Number(n).toLocaleString('en-IN');}
function monthLabel(y,m){return new Date(y,m,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});}
function todayStr(){return new Date().toISOString().slice(0,10);}

function computeStatus(p){
  const now=new Date();const due=new Date(p.dueDate);
  if(p.submission){
    if(p.submission.status==='rejected')return'Rejected';
    if(p.submission.status==='approved')return new Date(p.submission.paymentDate)<=due?'Received in time':'Received late';
    return'Awaiting Confirmation';
  }
  if(now>new Date(p.year,p.month+1,0))return'Missed';
  return'Pending';
}

function countdownInfo(dueDateStr){
  const now=new Date();now.setHours(0,0,0,0);
  const due=new Date(dueDateStr);due.setHours(0,0,0,0);
  const diff=Math.round((due-now)/(86400000));
  if(diff<0)return{text:`${Math.abs(diff)} days overdue`,color:'#dc2626',urgent:true};
  if(diff===0)return{text:'Due today',color:'#c2410c',urgent:true};
  if(diff<=5)return{text:`${diff} days remaining`,color:'#ea580c',urgent:true};
  return{text:`${diff} days remaining`,color:'#15803d',urgent:false};
}

// ═══ ICONS ══════════════════════════════════════════════════
const I={
  grid:<svg width="16"height="16"fill="none"viewBox="0 0 24 24"stroke="currentColor"strokeWidth="2"><rect x="3"y="3"width="7"height="7"rx="1"/><rect x="14"y="3"width="7"height="7"rx="1"/><rect x="3"y="14"width="7"height="7"rx="1"/><rect x="14"y="14"width="7"height="7"rx="1"/></svg>,
  card:<svg width="16"height="16"fill="none"viewBox="0 0 24 24"stroke="currentColor"strokeWidth="2"><rect x="2"y="5"width="20"height="14"rx="2"/><path d="M2 10h20"/></svg>,
  clock:<svg width="16"height="16"fill="none"viewBox="0 0 24 24"stroke="currentColor"strokeWidth="2"><circle cx="12"cy="12"r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
  inbox:<svg width="16"height="16"fill="none"viewBox="0 0 24 24"stroke="currentColor"strokeWidth="2"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>,
  doc:<svg width="16"height="16"fill="none"viewBox="0 0 24 24"stroke="currentColor"strokeWidth="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16"y1="13"x2="8"y2="13"/><line x1="16"y1="17"x2="8"y2="17"/></svg>,
  bank:<svg width="16"height="16"fill="none"viewBox="0 0 24 24"stroke="currentColor"strokeWidth="2"><path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"/></svg>,
  edit:<svg width="14"height="14"fill="none"viewBox="0 0 24 24"stroke="currentColor"strokeWidth="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
  eye:<svg width="14"height="14"fill="none"viewBox="0 0 24 24"stroke="currentColor"strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12"cy="12"r="3"/></svg>,
  chk:<svg width="14"height="14"fill="none"viewBox="0 0 24 24"stroke="currentColor"strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>,
  x:<svg width="14"height="14"fill="none"viewBox="0 0 24 24"stroke="currentColor"strokeWidth="2.5"><line x1="18"y1="6"x2="6"y2="18"/><line x1="6"y1="6"x2="18"y2="18"/></svg>,
  bell:<svg width="16"height="16"fill="none"viewBox="0 0 24 24"stroke="currentColor"strokeWidth="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>,
  up:<svg width="20"height="20"fill="none"viewBox="0 0 24 24"stroke="currentColor"strokeWidth="2"><polyline points="16 16 12 12 8 16"/><line x1="12"y1="12"x2="12"y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>,
  send:<svg width="16"height="16"fill="none"viewBox="0 0 24 24"stroke="currentColor"strokeWidth="2"><line x1="22"y1="2"x2="11"y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
  menu:<svg width="20"height="20"fill="none"viewBox="0 0 24 24"stroke="currentColor"strokeWidth="2"><line x1="3"y1="12"x2="21"y2="12"/><line x1="3"y1="6"x2="21"y2="6"/><line x1="3"y1="18"x2="21"y2="18"/></svg>,
};

// ═══ BADGE ══════════════════════════════════════════════════
function Badge({s}){
  const M={
    'Pending':{bg:'#fef9c3',co:'#854d0e',bo:'#fde68a'},
    'Awaiting Confirmation':{bg:'#eff6ff',co:'#1d4ed8',bo:'#bfdbfe'},
    'Received in time':{bg:'#f0fdf4',co:'#15803d',bo:'#86efac'},
    'Received late':{bg:'#fff7ed',co:'#c2410c',bo:'#fed7aa'},
    'Missed':{bg:'#fef2f2',co:'#dc2626',bo:'#fecaca'},
    'Rejected':{bg:'#fdf2f8',co:'#9d174d',bo:'#f9a8d4'},
  };
  const c=M[s]||{bg:'#f1f5f9',co:'#475569',bo:'#e2e8f0'};
  return<span style={{background:c.bg,color:c.co,border:`1px solid ${c.bo}`,borderRadius:6,padding:'3px 9px',fontSize:11,fontWeight:600,whiteSpace:'nowrap'}}>{s}</span>;
}

// ═══ STAT ════════════════════════════════════════════════════
function Stat({label,value,sub,accent}){
  return(
    <div style={{background:'#fff',borderRadius:12,padding:'16px 18px',boxShadow:'0 1px 4px rgba(0,0,0,.06)',border:'1px solid #e8edf5',flex:1,minWidth:128}}>
      <div style={{color:'#8898b3',fontSize:10,fontWeight:700,marginBottom:5,letterSpacing:'.5px',textTransform:'uppercase'}}>{label}</div>
      <div style={{color:accent||'#0f172a',fontSize:18,fontWeight:800,lineHeight:1.2}}>{value}</div>
      {sub&&<div style={{color:'#94a3b8',fontSize:11,marginTop:4}}>{sub}</div>}
    </div>
  );
}

// ═══ PROOF ══════════════════════════════════════════════════
function ProofThumb({proof}){
  if(!proof)return null;
  if(proof.type&&proof.type.startsWith('image/'))
    return<img src={proof.dataUrl} alt="proof" style={{maxWidth:'100%',maxHeight:180,borderRadius:8,border:'1px solid #e2e8f0',objectFit:'contain'}}/>;
  return<div style={{background:'#f8faff',borderRadius:8,border:'1px solid #e2e8f0',padding:'11px 14px',fontSize:13,color:'#374151'}}>📄 {proof.name||'Document'}</div>;
}

function ProofModal({proof,onClose}){
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:'#fff',borderRadius:16,padding:22,maxWidth:580,width:'100%',maxHeight:'90vh',overflow:'auto'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <h3 style={{margin:0,fontSize:16,fontWeight:700,color:'#0f172a'}}>Payment Proof</h3>
          <button onClick={onClose} style={{background:'#f1f5f9',border:'none',borderRadius:8,padding:'6px 10px',color:'#64748b',fontSize:18}}>✕</button>
        </div>
        {proof.type&&proof.type.startsWith('image/')
          ?<img src={proof.dataUrl} alt="proof" style={{width:'100%',borderRadius:8,border:'1px solid #e2e8f0'}}/>
          :<div style={{textAlign:'center',padding:32}}>
            <div style={{fontSize:48,marginBottom:12}}>📄</div>
            <div style={{fontWeight:700,fontSize:14,color:'#0f172a'}}>{proof.name}</div>
            <p style={{color:'#64748b',fontSize:13,marginTop:6}}>PDF cannot be previewed here.</p>
          </div>
        }
      </div>
    </div>
  );
}

// ═══ LAYOUT ═════════════════════════════════════════════════
function Layout({nav,active,setActive,badge,children}){
  const[mob,setMob]=useState(false);
  return(
    <div style={{display:'flex',minHeight:'100vh'}}>
      <div className="sidebar" style={{left:mob?0:undefined}}>
        <div style={{padding:'20px 16px 14px',borderBottom:'1px solid #1f2a3c',flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:34,height:34,background:'#2563eb',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:900,fontSize:16,flexShrink:0}}>৳</div>
            <div>
              <div style={{color:'#f1f5f9',fontWeight:700,fontSize:13}}>Finance Tracker</div>
              <div style={{color:'#4b5e7a',fontSize:10,marginTop:1}}>Rahad & Shammi</div>
            </div>
          </div>
        </div>
        <nav style={{flex:1,padding:'10px'}}>
          {nav.map(item=>(
            <button key={item.id} onClick={()=>{setActive(item.id);setMob(false);}}
              style={{display:'flex',alignItems:'center',gap:9,width:'100%',padding:'9px 10px',borderRadius:8,border:'none',
                background:active===item.id?'#2563eb':'transparent',
                color:active===item.id?'#fff':'#7a8fa8',
                fontSize:13,fontWeight:active===item.id?600:400,marginBottom:2,textAlign:'left'}}>
              {item.icon}{item.label}
              {item.badge>0&&<span style={{marginLeft:'auto',background:'#ef4444',color:'#fff',borderRadius:10,padding:'1px 7px',fontSize:10,fontWeight:700}}>{item.badge}</span>}
            </button>
          ))}
        </nav>
      </div>
      {mob&&<div onClick={()=>setMob(false)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.45)',zIndex:199}}/>}
      <div className="main">
        <style>{`@media(min-width:768px){.sidebar{left:0!important;}.main{margin-left:224px!important;}.mob-btn{display:none!important;}}@media(max-width:767px){.mob-btn{display:flex!important;}}`}</style>
        <div style={{background:'#fff',borderBottom:'1px solid #e8edf5',padding:'11px 20px',display:'flex',alignItems:'center',gap:12,position:'sticky',top:0,zIndex:50}}>
          <button className="mob-btn" onClick={()=>setMob(!mob)} style={{border:'none',background:'transparent',color:'#374151',padding:4,display:'none',alignItems:'center'}}>{I.menu}</button>
          <div style={{flex:1,fontWeight:700,color:'#0f172a',fontSize:14}}>{nav.find(n=>n.id===active)?.label||''}</div>
          {badge>0&&(
            <div style={{position:'relative',cursor:'pointer'}} onClick={()=>setActive('requests')}>
              <span style={{color:'#64748b'}}>{I.bell}</span>
              <span style={{position:'absolute',top:-6,right:-6,background:'#ef4444',color:'#fff',borderRadius:'50%',width:15,height:15,display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:700}}>{badge}</span>
            </div>
          )}
          <div style={{width:30,height:30,background:'#2563eb',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:800,fontSize:12}}>T</div>
        </div>
        <div style={{flex:1,padding:'22px 20px',maxWidth:1100,width:'100%',margin:'0 auto'}}>
          {children}
        </div>
      </div>
    </div>
  );
}

// ═══ APP ROOT ════════════════════════════════════════════════
function App(){
  const[state,setState]=useState(initState);
  const[sec,setSec]=useState('dashboard');
  const[selPay,setSelPay]=useState(null);
  const[proofModal,setProofModal]=useState(null);

  useEffect(()=>{save(state);},[state]);

  const updPayment=(id,fn)=>setState(prev=>({...prev,payments:prev.payments.map(p=>p.id===id?fn(p):p)}));
  const updBank=(bank)=>setState(prev=>({...prev,bank}));

  const rows=useMemo(()=>state.payments.map(p=>({...p,cs:computeStatus(p)})),[state.payments]);
  const awaiting=useMemo(()=>rows.filter(p=>p.submission&&p.submission.status==='pending').length,[rows]);
  const approved=useMemo(()=>rows.filter(p=>p.submission&&p.submission.status==='approved'),[rows]);
  const totRec=useMemo(()=>approved.reduce((s,p)=>s+(p.submission?.paidAmount||0),0),[approved]);
  const totExp=rows.length*AGR.interest;

  const nav=[
    {id:'dashboard',label:'Dashboard',icon:I.grid,badge:0},
    {id:'payments',label:'Monthly Payments',icon:I.card,badge:0},
    {id:'requests',label:'Payment Requests',icon:I.inbox,badge:awaiting},
    {id:'history',label:'Payment History',icon:I.clock,badge:0},
    {id:'submit',label:'Record Payment',icon:I.send,badge:0},
    {id:'agreement',label:'Agreement Details',icon:I.doc,badge:0},
    {id:'bank',label:'Bank Details',icon:I.bank,badge:0},
  ];

  const approvePayment=(id,ok)=>{
    updPayment(id,p=>({...p,submission:{...p.submission,status:ok?'approved':'rejected',confirmedAt:new Date().toISOString(),confirmedBy:'Tazwaar'}}));
    setSelPay(null);
  };

  return(
    <Layout nav={nav} active={sec} setActive={setSec} badge={awaiting}>
      {sec==='dashboard'&&<Dashboard rows={rows} totRec={totRec} totExp={totExp} approved={approved} awaiting={awaiting} setSec={setSec} setSelPay={setSelPay}/>}
      {sec==='payments'&&<MonthTable rows={rows} onReview={p=>{setSelPay(p);setSec('requests');}} onProof={setProofModal}/>}
      {sec==='requests'&&<Requests rows={rows} sel={selPay} onSel={setSelPay} onApprove={approvePayment} onProof={setProofModal}/>}
      {sec==='history'&&<History rows={rows} onProof={setProofModal}/>}
      {sec==='submit'&&<RecordPayment rows={rows} updPayment={updPayment} setSec={setSec}/>}
      {sec==='agreement'&&<AgrDetail totalMonths={rows.length}/>}
      {sec==='bank'&&<BankSection bank={state.bank} onSave={updBank}/>}
      {proofModal&&<ProofModal proof={proofModal} onClose={()=>setProofModal(null)}/>}
    </Layout>
  );
}

// ═══ DASHBOARD ══════════════════════════════════════════════
function Dashboard({rows,totRec,totExp,approved,awaiting,setSec,setSelPay}){
  const now=new Date();
  const lateCount=rows.filter(p=>p.cs==='Received late').length;
  const missedCount=rows.filter(p=>p.cs==='Missed').length;
  const remaining=rows.filter(p=>p.cs==='Pending'||p.cs==='Awaiting Confirmation').length;
  const totPend=totExp-totRec;
  const nextDue=rows.find(p=>p.cs==='Pending'||p.cs==='Awaiting Confirmation');
  const countdown=nextDue?countdownInfo(nextDue.dueDate):null;
  const curMonth=rows.find(p=>p.year===now.getFullYear()&&p.month===now.getMonth());

  return(
    <div>
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:20,fontWeight:800,color:'#0f172a',margin:'0 0 3px'}}>Finance Tracker</h2>
        <p style={{color:'#64748b',fontSize:13}}>Rahad → Shammi interest agreement overview</p>
      </div>

      {/* NEXT PAYMENT HERO CARD */}
      {nextDue&&(
        <div style={{
          background:countdown.urgent
            ?'linear-gradient(135deg,#7f1d1d 0%,#b91c1c 100%)'
            :'linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%)',
          borderRadius:16,padding:'22px 24px',marginBottom:20,
          boxShadow:countdown.urgent?'0 8px 32px rgba(220,38,38,.25)':'0 8px 32px rgba(37,99,235,.20)',
          color:'#fff',
        }}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:14}}>
            <div style={{flex:1}}>
              <div style={{fontSize:11,fontWeight:700,opacity:.7,textTransform:'uppercase',letterSpacing:'.6px',marginBottom:8}}>
                {countdown.urgent?'⚠ PAYMENT URGENT':'📅 NEXT PAYMENT DUE'}
              </div>
              <div style={{fontSize:28,fontWeight:900,marginBottom:6,lineHeight:1.1}}>{monthLabel(nextDue.year,nextDue.month)}</div>
              <div style={{fontSize:14,opacity:.85}}>Due date: <strong>{fmtDate(nextDue.dueDate)}</strong></div>
              <div style={{fontSize:14,opacity:.85,marginTop:3}}>Amount: <strong>{fmtTaka(nextDue.expectedAmount)}</strong></div>
              {nextDue.cs==='Awaiting Confirmation'&&(
                <div style={{marginTop:12,background:'rgba(255,255,255,.15)',borderRadius:8,padding:'9px 13px',fontSize:13,fontWeight:600}}>
                  ✓ Payment submitted — tap to review & confirm
                </div>
              )}
            </div>
            <div style={{textAlign:'center',flexShrink:0}}>
              <div style={{background:'rgba(255,255,255,.15)',borderRadius:14,padding:'16px 22px',backdropFilter:'blur(4px)',minWidth:120}}>
                <div style={{fontSize:38,fontWeight:900,lineHeight:1}}>
                  {countdown.text.split(' ')[0]}
                </div>
                <div style={{fontSize:12,opacity:.85,marginTop:4}}>
                  {countdown.text.split(' ').slice(1).join(' ')||'day'}
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {!nextDue&&(
        <div style={{background:'linear-gradient(135deg,#14532d,#16a34a)',borderRadius:16,padding:'22px 24px',marginBottom:20,color:'#fff',boxShadow:'0 8px 32px rgba(22,163,74,.25)'}}>
          <div style={{fontSize:11,fontWeight:700,opacity:.8,textTransform:'uppercase',letterSpacing:'.6px',marginBottom:8}}>🎉 AGREEMENT STATUS</div>
          <div style={{fontSize:22,fontWeight:800}}>All payments completed!</div>
          <div style={{fontSize:14,opacity:.85,marginTop:4}}>Agreement with Shammi is fully settled.</div>
        </div>
      )}

      {/* Pending confirmation banner */}
      {awaiting>0&&(
        <div onClick={()=>setSec('requests')} style={{background:'#eff6ff',border:'1.5px solid #bfdbfe',borderRadius:12,padding:'12px 16px',marginBottom:16,cursor:'pointer',display:'flex',alignItems:'center',gap:12}}>
          <span style={{color:'#2563eb'}}>{I.bell}</span>
          <div>
            <div style={{fontWeight:700,color:'#1d4ed8',fontSize:14}}>{awaiting} payment{awaiting>1?'s':''} awaiting your confirmation</div>
            <div style={{color:'#3b82f6',fontSize:12,marginTop:2}}>Click to review →</div>
          </div>
        </div>
      )}

      {/* Stats row */}
      <div style={{display:'flex',flexWrap:'wrap',gap:11,marginBottom:20}}>
        <Stat label="Principal" value={fmtTaka(400000)} sub="Fixed"/>
        <Stat label="Interest / month" value={fmtTaka(14000)} sub="Fixed"/>
        <Stat label="Total Received" value={fmtTaka(totRec)} sub={`${approved.length} payments`} accent="#15803d"/>
        <Stat label="Total Pending" value={fmtTaka(totPend)} sub={`${remaining} remaining`} accent="#c2410c"/>
        <Stat label="Received" value={approved.length} sub={`${lateCount} late · ${missedCount} missed`}/>
        <Stat label="Remaining" value={remaining}/>
      </div>

      {/* Summary + recent */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:16}}>
        <div style={{background:'#fff',borderRadius:12,padding:20,border:'1px solid #e8edf5',boxShadow:'0 1px 4px rgba(0,0,0,.05)'}}>

// ═══ RECORD PAYMENT ═════════════════════════════════════════
function RecordPayment({rows,updPayment,setSec}){
  const now=new Date();
  const eligible=rows.filter(p=>{const s=p.cs;return s==='Pending'||s==='Rejected';});
  const[selId,setSelId]=useState(()=>{const c=eligible.find(p=>p.year===now.getFullYear()&&p.month===now.getMonth());return c?.id||eligible[0]?.id||'';});
  const[form,setForm]=useState({paymentDate:todayStr(),paidAmount:'14000',note:''});
  const[pf,setPf]=useState(null);
  const[err,setErr]=useState('');
  const[ok,setOk]=useState(false);

  const sel=rows.find(p=>p.id===selId);

  const onFile=e=>{
    const f=e.target.files[0];if(!f)return;
    if(!['image/jpeg','image/jpg','image/png','application/pdf'].includes(f.type)){setErr('Only JPG, PNG, or PDF files.');return;}
    if(f.size>5*1024*1024){setErr('Max file size is 5 MB.');return;}
    const r=new FileReader();
    r.onload=ev=>{setPf({name:f.name,type:f.type,dataUrl:ev.target.result});setErr('');};
    r.readAsDataURL(f);
  };

  const submit=()=>{
    setErr('');
    if(!selId){setErr('Select a payment month.');return;}
    if(!form.paymentDate){setErr('Enter payment date.');return;}
    const amt=Number(form.paidAmount);
    if(!amt||amt<=0){setErr('Enter a valid amount.');return;}
    if(!pf){setErr('Upload payment proof.');return;}
    updPayment(selId,p=>({...p,submission:{paymentDate:form.paymentDate,paidAmount:amt,note:form.note,proof:pf,submittedAt:new Date().toISOString(),status:'pending'}}));
    setOk(true);
  };

  if(ok)return(
    <div style={{maxWidth:460,textAlign:'center',margin:'0 auto',paddingTop:40}}>
      <div style={{fontSize:54,marginBottom:14}}>✅</div>
      <h3 style={{fontSize:19,fontWeight:800,color:'#0f172a',margin:'0 0 8px'}}>Payment Recorded</h3>
      <p style={{color:'#64748b',fontSize:14}}>Go to Payment Requests to approve it.</p>
      <button onClick={()=>{setOk(false);setSec('requests');}} style={{background:'#2563eb',color:'#fff',border:'none',borderRadius:8,padding:'10px 22px',fontSize:14,fontWeight:700,marginTop:16}}>Review Now</button>
    </div>
  );

  return(
    <div style={{maxWidth:500}}>
      <h2 style={{fontSize:18,fontWeight:800,color:'#0f172a',marginBottom:6}}>Record Payment</h2>
      <p style={{color:'#64748b',fontSize:13,marginBottom:18}}>Record a payment received from Shammi.</p>
      {eligible.length===0
        ?<div style={{background:'#f0fdf4',borderRadius:12,padding:24,textAlign:'center',color:'#15803d',fontWeight:600,border:'1px solid #86efac'}}>All payments submitted or confirmed.</div>
        :<div style={{background:'#fff',borderRadius:12,border:'1px solid #e8edf5',padding:22,boxShadow:'0 1px 4px rgba(0,0,0,.05)'}}>
          {err&&<div style={{background:'#fef2f2',color:'#dc2626',border:'1px solid #fecaca',borderRadius:8,padding:'9px 13px',fontSize:13,marginBottom:14}}>{err}</div>}
          <div style={{marginBottom:14}}>
            <label style={{fontSize:12,fontWeight:700,color:'#374151',display:'block',marginBottom:5}}>Payment Month</label>
            <select value={selId} onChange={e=>setSelId(e.target.value)}
              style={{width:'100%',border:'1.5px solid #e2e8f0',borderRadius:8,padding:'10px 12px',fontSize:13,background:'#fff',outline:'none',color:'#0f172a'}}>
              <option value="">Select month…</option>
              {eligible.map(p=><option key={p.id} value={p.id}>{monthLabel(p.year,p.month)} — {fmtTaka(p.expectedAmount)}</option>)}
            </select>
          </div>
          {sel&&(
            <div style={{background:'#f8faff',borderRadius:8,padding:'9px 13px',marginBottom:14,display:'flex',gap:16,flexWrap:'wrap'}}>
              <div><div style={{fontSize:10,color:'#8898b3',fontWeight:700,textTransform:'uppercase'}}>Amount Due</div><div style={{fontWeight:700,color:'#0f172a'}}>{fmtTaka(sel.expectedAmount)}</div></div>
              <div><div style={{fontSize:10,color:'#8898b3',fontWeight:700,textTransform:'uppercase'}}>Due Date</div><div style={{fontWeight:700,color:'#0f172a'}}>{fmtDate(sel.dueDate)}</div></div>
            </div>
          )}
          <div style={{marginBottom:14}}>
            <label style={{fontSize:12,fontWeight:700,color:'#374151',display:'block',marginBottom:5}}>Payment Date</label>
            <input type="date" value={form.paymentDate} onChange={e=>setForm({...form,paymentDate:e.target.value})}
              style={{width:'100%',border:'1.5px solid #e2e8f0',borderRadius:8,padding:'10px 12px',fontSize:13,outline:'none',color:'#0f172a'}}/>
          </div>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:12,fontWeight:700,color:'#374151',display:'block',marginBottom:5}}>Amount Paid (৳)</label>
            <input type="number" value={form.paidAmount} onChange={e=>setForm({...form,paidAmount:e.target.value})}
              style={{width:'100%',border:'1.5px solid #e2e8f0',borderRadius:8,padding:'10px 12px',fontSize:13,outline:'none',color:'#0f172a'}}/>
          </div>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:12,fontWeight:700,color:'#374151',display:'block',marginBottom:5}}>Payment Proof (JPG, PNG, PDF)</label>
            <div onClick={()=>document.getElementById('pf-upload').click()} style={{border:'2px dashed #bfdbfe',borderRadius:10,padding:22,textAlign:'center',cursor:'pointer',background:'#f8faff'}}>
              {pf
                ?<div style={{color:'#15803d',fontWeight:700,fontSize:13}}>✓ {pf.name}</div>
                :<div>
                  <div style={{color:'#2563eb',display:'flex',justifyContent:'center',marginBottom:6}}>{I.up}</div>
                  <div style={{color:'#374151',fontSize:13,fontWeight:600}}>Click to upload proof</div>
                  <div style={{color:'#94a3b8',fontSize:11,marginTop:3}}>JPG, PNG or PDF — max 5 MB</div>
                </div>
              }
            </div>
            <input id="pf-upload" type="file" accept=".jpg,.jpeg,.png,.pdf" onChange={onFile} style={{display:'none'}}/>
          </div>
          <div style={{marginBottom:18}}>
            <label style={{fontSize:12,fontWeight:700,color:'#374151',display:'block',marginBottom:5}}>Note (optional)</label>
            <textarea value={form.note} onChange={e=>setForm({...form,note:e.target.value})} rows={2} placeholder="Any notes…"
              style={{width:'100%',border:'1.5px solid #e2e8f0',borderRadius:8,padding:'9px 12px',fontSize:13,resize:'vertical',outline:'none',color:'#0f172a'}}/>
          </div>
          <button onClick={submit} style={{width:'100%',background:'#2563eb',color:'#fff',border:'none',borderRadius:8,padding:12,fontSize:15,fontWeight:700}}>
            Record Payment
          </button>
        </div>
      }
    </div>
  );
}

          ))}
          <div style={{marginTop:18,padding:'14px 16px',background:'#f8faff',borderRadius:10,border:'1px solid #e2e8f0'}}>
            <h4 style={{fontSize:12,fontWeight:700,color:'#0f172a',margin:'0 0 10px'}}>Timeline</h4>
            {[{date:'13 Sep 2026',label:'Agreement started',color:'#2563eb'},{date:'Every month',label:'৳14,000 interest',color:'#7c3aed'},{date:'15th',label:'Payment deadline',color:'#0891b2'},{date:'Sep 2028',label:'Agreement ends',color:'#dc2626'}].map((item,i)=>(
              <div key={i} style={{display:'flex',gap:10,alignItems:'center',marginBottom:8}}>
                <div style={{width:8,height:8,borderRadius:'50%',background:item.color,flexShrink:0}}/>
                <span style={{fontSize:12,color:'#64748b',fontWeight:600,minWidth:70}}>{item.date}</span>
                <span style={{fontSize:12,color:'#0f172a',fontWeight:600}}>{item.label}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══ BANK DETAILS ═══════════════════════════════════════════
function BankSection({bank,onSave}){
  const[editing,setEditing]=useState(false);
  const[form,setForm]=useState({...bank});
  useEffect(()=>{setForm({...bank});},[bank]);
  const fields=[
    {k:'accountName',l:'Account Name'},
    {k:'bankName',l:'Bank Name'},
    {k:'accountNumber',l:'Account Number'},
    {k:'branchName',l:'Branch Name'},
    {k:'routingNumber',l:'Routing Number'},
    {k:'mobileNumber',l:'Mobile Banking Number'},
    {k:'note',l:'Transfer Note',multi:true},
  ];
  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
        <h2 style={{fontSize:18,fontWeight:800,color:'#0f172a',margin:0}}>Bank Account Details</h2>
        {!editing&&(
          <button onClick={()=>setEditing(true)} style={{display:'flex',alignItems:'center',gap:6,background:'#2563eb',color:'#fff',border:'none',borderRadius:8,padding:'8px 15px',fontSize:13,fontWeight:700}}>
            {I.edit} Edit
          </button>
        )}
      </div>
      <div style={{background:'#fff',borderRadius:12,border:'1px solid #e8edf5',padding:22,maxWidth:540,boxShadow:'0 1px 4px rgba(0,0,0,.05)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:18,padding:'13px 15px',background:'#eff6ff',borderRadius:10,border:'1px solid #bfdbfe'}}>
          <div style={{width:38,height:38,background:'#2563eb',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',flexShrink:0}}>{I.bank}</div>
          <div>
            <div style={{fontWeight:700,color:'#0f172a',fontSize:15}}>{bank.accountName}</div>
            <div style={{color:'#3b82f6',fontSize:12}}>Receiving Account</div>
          </div>
        </div>
        {!editing
          ?fields.map(({k,l})=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid #f1f5f9',gap:12}}>
              <span style={{color:'#64748b',fontSize:13,minWidth:140,flexShrink:0}}>{l}</span>
              <span style={{color:'#0f172a',fontSize:13,fontWeight:700,textAlign:'right',wordBreak:'break-all'}}>{bank[k]||'—'}</span>
            </div>
          ))
          :<div>
            {fields.map(({k,l,multi})=>(
              <div key={k} style={{marginBottom:13}}>
                <label style={{fontSize:12,fontWeight:700,color:'#374151',display:'block',marginBottom:5}}>{l}</label>
                {multi
                  ?<textarea value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} rows={2} style={{width:'100%',border:'1.5px solid #e2e8f0',borderRadius:8,padding:'9px 12px',fontSize:13,resize:'vertical',outline:'none'}}/>
                  :<input value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} style={{width:'100%',border:'1.5px solid #e2e8f0',borderRadius:8,padding:'9px 12px',fontSize:13,outline:'none'}}/>
                }
              </div>
            ))}
            <div style={{display:'flex',gap:10,marginTop:14}}>
              <button onClick={()=>{onSave(form);setEditing(false);}} style={{flex:1,background:'#2563eb',color:'#fff',border:'none',borderRadius:8,padding:10,fontSize:13,fontWeight:700}}>Save Changes</button>
              <button onClick={()=>{setEditing(false);setForm({...bank});}} style={{flex:1,background:'#f1f5f9',color:'#374151',border:'none',borderRadius:8,padding:10,fontSize:13,fontWeight:600}}>Cancel</button>
            </div>
          </div>
        }
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
