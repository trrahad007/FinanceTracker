// ═══════════════════════════════════════════════════════════════
//  STORAGE
// ═══════════════════════════════════════════════════════════════
const SK='ft_tazwaar_v2';
function load(){try{const r=localStorage.getItem(SK);return r?JSON.parse(r):null;}catch{return null;}}
function save(s){try{localStorage.setItem(SK,JSON.stringify(s));}catch{}}

// ═══════════════════════════════════════════════════════════════
//  AGREEMENT CONFIG
// ═══════════════════════════════════════════════════════════════
const AGR={principal:400000,interest:14000,deadline:15};

function genSchedule(){
  const rows=[];let y=2026,m=8,id=1;
  while(y<2028||(y===2028&&m<=8)){
    const due=new Date(y,m,AGR.deadline);
    rows.push({id:`p${id++}`,year:y,month:m,
      dueDate:due.toISOString().slice(0,10),
      expectedAmount:AGR.interest,
      payment:null  // {paymentDate, paidAmount, note, proof, recordedAt}
    });
    m++;if(m>11){m=0;y++;}
  }
  return rows;
}

const DEFAULT_BANK={
  accountName:'Tazwaar',
  bankName:'Dutch-Bangla Bank Limited',
  accountNumber:'1234567890',
  branchName:'Gulshan Branch',
  routingNumber:'090261234',
  mobileNumber:'01712-345678',
  note:'Please mention your name and payment month in the transfer description.',
};

function initState(){
  const s=load();
  // Migrate old format if needed
  if(s&&s.payments&&s.payments.length>0){
    const migrated=s.payments.map(p=>{
      if(p.payment!==undefined)return p; // already new format
      // old format had p.submission
      const sub=p.submission;
      if(sub&&sub.status==='approved'){
        return{...p,payment:{paymentDate:sub.paymentDate,paidAmount:sub.paidAmount,note:sub.note||'',proof:sub.proof||null,recordedAt:sub.confirmedAt||sub.submittedAt},submission:undefined};
      }
      return{...p,payment:null,submission:undefined};
    });
    return{payments:migrated,bank:s.bank||DEFAULT_BANK};
  }
  return{payments:genSchedule(),bank:DEFAULT_BANK};
}

// ═══════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════
function fmtDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function fmtTaka(n){return'৳'+Number(n).toLocaleString('en-IN');}
function monthLabel(y,m){return new Date(y,m,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});}
function todayStr(){return new Date().toISOString().slice(0,10);}

function computeStatus(p){
  const now=new Date();
  const due=new Date(p.dueDate);
  if(p.payment){
    return new Date(p.payment.paymentDate)<=due?'Received in time':'Received late';
  }
  if(now>new Date(p.year,p.month+1,0))return'Missed';
  return'Pending';
}

function countdownInfo(dueDateStr){
  const now=new Date();now.setHours(0,0,0,0);
  const due=new Date(dueDateStr);due.setHours(0,0,0,0);
  const diff=Math.round((due-now)/86400000);
  if(diff<0)return{text:`${Math.abs(diff)} days overdue`,color:'#dc2626',urgent:true};
  if(diff===0)return{text:'Due today',color:'#c2410c',urgent:true};
  if(diff<=5)return{text:`${diff} days remaining`,color:'#ea580c',urgent:true};
  return{text:`${diff} days remaining`,color:'#15803d',urgent:false};
}

    <div style={{minHeight:'100vh',background:'#f0f4fb',display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>

        <p style={{textAlign:'center',color:'#94a3b8',fontSize:11,marginTop:18}}>Use credentials shared by Rahad (Tazwaar)</p>

  );
}

// ═══════════════════════════════════════════════════════════════
//  APP ROOT
// ═══════════════════════════════════════════════════════════════
function App(){
  const[user,setUser]=useState(null);
  const[state,setState]=useState(initState);
  const[sec,setSec]=useState('dashboard');
  const[proofModal,setProofModal]=useState(null);

  // Poll localStorage every 3s so viewer sees Rahad's changes
  useEffect(()=>{
    const id=setInterval(()=>{
      const fresh=load();
      if(fresh&&JSON.stringify(fresh)!==JSON.stringify(state)){
        setState(fresh);
      }
    },3000);
    return()=>clearInterval(id);
  },[state]);

  useEffect(()=>{save(state);},[state]);

  const updPayment=(id,fn)=>setState(prev=>({...prev,payments:prev.payments.map(p=>p.id===id?fn(p):p)}));
  const updBank=bank=>setState(prev=>({...prev,bank}));

  const rows=useMemo(()=>state.payments.map(p=>({...p,cs:computeStatus(p)})),[state.payments]);
  const paid=useMemo(()=>rows.filter(p=>p.payment),[rows]);
  const totRec=useMemo(()=>paid.reduce((s,p)=>s+(p.payment.paidAmount||0),0),[paid]);
  const totExp=rows.length*AGR.interest;

  if(!user)return<Login onLogin={u=>{setUser(u);setSec('dashboard');}}/>;

  const isAdmin=user.role==='admin';

  const adminNav=[
    {id:'dashboard',label:'Dashboard',icon:I.grid},
    {id:'payments',label:'Monthly Payments',icon:I.card},
    {id:'history',label:'Payment History',icon:I.clock},
    {id:'record',label:'Record Payment',icon:I.save},
    {id:'agreement',label:'Agreement Details',icon:I.doc},
    {id:'bank',label:'Bank Details',icon:I.bank},
  ];
  const viewerNav=[
    {id:'dashboard',label:'Dashboard',icon:I.grid},
    {id:'payments',label:'Monthly Payments',icon:I.card},
    {id:'history',label:'Payment History',icon:I.clock},
    {id:'agreement',label:'Agreement Details',icon:I.doc},
    {id:'bank',label:'Bank Details',icon:I.bank},
  ];
  const nav=isAdmin?adminNav:viewerNav;

  return(
    <Layout nav={nav} active={sec} setActive={setSec} user={user} onLogout={()=>{setUser(null);setSec('dashboard');}}>
      {sec==='dashboard'&&<Dashboard rows={rows} totRec={totRec} totExp={totExp} paid={paid} isAdmin={isAdmin} setSec={setSec}/>}
      {sec==='payments'&&<MonthTable rows={rows} isAdmin={isAdmin} updPayment={updPayment} onProof={setProofModal} setSec={setSec}/>}
      {sec==='history'&&<History rows={rows} onProof={setProofModal}/>}
      {sec==='record'&&isAdmin&&<RecordPayment rows={rows} updPayment={updPayment} setSec={setSec}/>}
      {sec==='agreement'&&<AgrDetail totalMonths={rows.length}/>}
      {sec==='bank'&&<BankSection bank={state.bank} isAdmin={isAdmin} onSave={updBank}/>}
      {proofModal&&<ProofModal proof={proofModal} onClose={()=>setProofModal(null)}/>}
    </Layout>
  );
}

// ═══════════════════════════════════════════════════════════════
//  DASHBOARD
// ═══════════════════════════════════════════════════════════════
function Dashboard({rows,totRec,totExp,paid,isAdmin,setSec}){
  const now=new Date();
  const lateCount=rows.filter(p=>p.cs==='Received late').length;
  const missedCount=rows.filter(p=>p.cs==='Missed').length;
  const remaining=rows.filter(p=>p.cs==='Pending').length;
  const totPend=totExp-totRec;
  const nextDue=rows.find(p=>p.cs==='Pending');
  const countdown=nextDue?countdownInfo(nextDue.dueDate):null;

  return(
    <div>
      <div style={{marginBottom:20}}>

// ═══════════════════════════════════════════════════════════════
//  MONTHLY TABLE — with inline edit for admin
// ═══════════════════════════════════════════════════════════════
function MonthTable({rows,isAdmin,updPayment,onProof,setSec}){
  const now=new Date();
  const[editId,setEditId]=useState(null);
  const[form,setForm]=useState({});
  const[pf,setPf]=useState(null);
  const[err,setErr]=useState('');
  const fRef=useRef();

  const startEdit=(p)=>{
    setEditId(p.id);
    setErr('');
    setPf(null);
    if(p.payment){
      setForm({paymentDate:p.payment.paymentDate,paidAmount:String(p.payment.paidAmount),note:p.payment.note||''});
    } else {
      setForm({paymentDate:todayStr(),paidAmount:String(AGR.interest),note:''});
    }
  };

  const cancelEdit=()=>{setEditId(null);setErr('');setPf(null);};

  const onFile=e=>{
    const f=e.target.files[0];if(!f)return;
    if(!['image/jpeg','image/jpg','image/png','application/pdf'].includes(f.type)){setErr('Only JPG, PNG, or PDF.');return;}
    if(f.size>5*1024*1024){setErr('Max 5 MB.');return;}
    const r=new FileReader();
    r.onload=ev=>{setPf({name:f.name,type:f.type,dataUrl:ev.target.result});setErr('');};
    r.readAsDataURL(f);
  };

  const saveEdit=(p)=>{
    setErr('');
    if(!form.paymentDate){setErr('Enter payment date.');return;}
    const amt=Number(form.paidAmount);
    if(!amt||amt<=0){setErr('Enter valid amount.');return;}
    const existingProof=p.payment?.proof||null;
    updPayment(p.id,px=>({...px,payment:{paymentDate:form.paymentDate,paidAmount:amt,note:form.note,proof:pf||existingProof,recordedAt:new Date().toISOString()}}));
    cancelEdit();
  };

  const deletePayment=(id)=>{
    if(!window.confirm('Remove this payment record?'))return;
    updPayment(id,p=>({...p,payment:null}));
  };

  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18,flexWrap:'wrap',gap:10}}>
        <h2 style={{fontSize:18,fontWeight:800,color:'#0f172a',margin:0}}>Monthly Payments</h2>
        {isAdmin&&<button onClick={()=>setSec('record')} style={{background:'#2563eb',color:'#fff',border:'none',borderRadius:8,padding:'8px 16px',fontSize:13,fontWeight:700}}>+ Record Payment</button>}
      </div>
      <div style={{background:'#fff',borderRadius:12,border:'1px solid #e8edf5',overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,.05)'}}>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            <thead>
              <tr style={{background:'#f8faff'}}>
                {['Month','Due Date','Amount','Payment Date','Status','Proof',isAdmin?'Actions':''].map(h=>(
                  <th key={h} style={{padding:'11px 13px',textAlign:'left',color:'#8898b3',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'.5px',whiteSpace:'nowrap'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((p,i)=>{
                const cur=p.year===now.getFullYear()&&p.month===now.getMonth();
                const cd=p.cs==='Pending'?countdownInfo(p.dueDate):null;
                const isEditing=editId===p.id;

                if(isEditing&&isAdmin)return(
                  <tr key={p.id} style={{background:'#f0f6ff',borderTop:'2px solid #2563eb'}}>
                    <td colSpan={7} style={{padding:'16px 14px'}}>
                      <div style={{fontWeight:700,color:'#2563eb',fontSize:13,marginBottom:12}}>✏ Editing: {monthLabel(p.year,p.month)}</div>
                      {err&&<div style={{background:'#fef2f2',color:'#dc2626',border:'1px solid #fecaca',borderRadius:7,padding:'8px 12px',fontSize:12,marginBottom:10}}>{err}</div>}
                      <div style={{display:'flex',flexWrap:'wrap',gap:12,alignItems:'flex-end'}}>
                        <div style={{flex:'1 1 140px'}}>
                          <div style={{fontSize:11,fontWeight:700,color:'#374151',marginBottom:4}}>Payment Date</div>
                          <input type="date" value={form.paymentDate} onChange={e=>setForm({...form,paymentDate:e.target.value})}
                            style={{width:'100%',border:'1.5px solid #c7d2e1',borderRadius:7,padding:'8px 10px',fontSize:13,outline:'none',color:'#0f172a'}}/>
                        </div>
                        <div style={{flex:'1 1 120px'}}>
                          <div style={{fontSize:11,fontWeight:700,color:'#374151',marginBottom:4}}>Amount (৳)</div>
                          <input type="number" value={form.paidAmount} onChange={e=>setForm({...form,paidAmount:e.target.value})}
                            style={{width:'100%',border:'1.5px solid #c7d2e1',borderRadius:7,padding:'8px 10px',fontSize:13,outline:'none',color:'#0f172a'}}/>
                        </div>
                        <div style={{flex:'1 1 160px'}}>
                          <div style={{fontSize:11,fontWeight:700,color:'#374151',marginBottom:4}}>Note (optional)</div>
                          <input value={form.note} onChange={e=>setForm({...form,note:e.target.value})} placeholder="Optional note…"
                            style={{width:'100%',border:'1.5px solid #c7d2e1',borderRadius:7,padding:'8px 10px',fontSize:13,outline:'none',color:'#0f172a'}}/>
                        </div>
                        <div style={{flex:'1 1 160px'}}>
                          <div style={{fontSize:11,fontWeight:700,color:'#374151',marginBottom:4}}>
                            Proof {p.payment?.proof&&!pf?'(current kept)':'(JPG/PNG/PDF)'}
                          </div>
                          <div onClick={()=>fRef.current.click()} style={{border:'1.5px dashed #93c5fd',borderRadius:7,padding:'8px 12px',cursor:'pointer',background:'#f8faff',fontSize:12,color:pf?'#15803d':'#374151',fontWeight:pf?700:400}}>
                            {pf?`✓ ${pf.name}`:p.payment?.proof?'Click to replace proof':'Click to upload'}
                          </div>
                          <input ref={fRef} type="file" accept=".jpg,.jpeg,.png,.pdf" onChange={onFile} style={{display:'none'}}/>
                        </div>
                        <div style={{display:'flex',gap:8}}>
                          <button onClick={()=>saveEdit(p)} style={{background:'#16a34a',color:'#fff',border:'none',borderRadius:7,padding:'9px 16px',fontSize:13,fontWeight:700,whiteSpace:'nowrap'}}>Save</button>
                          <button onClick={cancelEdit} style={{background:'#f1f5f9',color:'#374151',border:'none',borderRadius:7,padding:'9px 14px',fontSize:13,fontWeight:600}}>Cancel</button>
                        </div>
                      </div>
                    </td>
                  </tr>
                );

                return(
                  <tr key={p.id} style={{background:cur?'#eff6ff':i%2===0?'#fff':'#fafbff',borderTop:'1px solid #f1f5f9'}}>
                    <td style={{padding:'10px 13px',whiteSpace:'nowrap'}}>
                      <div style={{fontWeight:cur?700:500,color:'#0f172a',display:'flex',alignItems:'center',gap:6}}>
                        {monthLabel(p.year,p.month)}
                        {cur&&<span style={{fontSize:9,background:'#2563eb',color:'#fff',borderRadius:4,padding:'1px 5px',fontWeight:700}}>NOW</span>}
                      </div>
                      {cd&&<div style={{fontSize:11,color:cd.color,fontWeight:600,marginTop:2}}>{cd.text}</div>}
                    </td>
                    <td style={{padding:'10px 13px',color:'#475569',whiteSpace:'nowrap'}}>{fmtDate(p.dueDate)}</td>
                    <td style={{padding:'10px 13px',fontWeight:700,color:'#0f172a'}}>{fmtTaka(p.expectedAmount)}</td>
                    <td style={{padding:'10px 13px',color:'#475569',whiteSpace:'nowrap'}}>{p.payment?.paymentDate?fmtDate(p.payment.paymentDate):'—'}</td>
                    <td style={{padding:'10px 13px'}}><Badge s={p.cs}/></td>
                    <td style={{padding:'10px 13px'}}>
                      {p.payment?.proof
                        ?<button onClick={()=>onProof(p.payment.proof)} style={{background:'none',border:'1px solid #e2e8f0',borderRadius:6,padding:'4px 9px',color:'#2563eb',fontSize:12,display:'flex',alignItems:'center',gap:4}}>{I.eye}View</button>
                        :'—'}
                    </td>
                    {isAdmin&&(
                      <td style={{padding:'10px 13px'}}>
                        <div style={{display:'flex',gap:6}}>
                          <button onClick={()=>startEdit(p)} style={{background:'#f0f6ff',color:'#2563eb',border:'1px solid #bfdbfe',borderRadius:6,padding:'5px 10px',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:4}}>
                            {I.edit}{p.payment?'Edit':'Add'}
                          </button>
                          {p.payment&&(
                            <button onClick={()=>deletePayment(p.id)} style={{background:'#fef2f2',color:'#dc2626',border:'1px solid #fecaca',borderRadius:6,padding:'5px 9px',fontSize:12,display:'flex',alignItems:'center',gap:3}}>
                              {I.trash}
                            </button>
                          )}
                        </div>
                      </td>
                    )}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  HISTORY
// ═══════════════════════════════════════════════════════════════
function History({rows,onProof}){
  const[filter,setFilter]=useState('All');
  const filters=['All','Received in time','Received late','Pending','Missed'];
  const shown=filter==='All'?rows:rows.filter(p=>p.cs===filter);
  return(
    <div>
      <h2 style={{fontSize:18,fontWeight:800,color:'#0f172a',marginBottom:16}}>Payment History</h2>
      <div style={{display:'flex',flexWrap:'wrap',gap:7,marginBottom:16}}>
        {filters.map(f=>(
          <button key={f} onClick={()=>setFilter(f)}
            style={{padding:'5px 12px',borderRadius:7,border:'1.5px solid',borderColor:filter===f?'#2563eb':'#e2e8f0',background:filter===f?'#2563eb':'#fff',color:filter===f?'#fff':'#374151',fontSize:12,fontWeight:600}}>
            {f}
          </button>
        ))}
      </div>
      <div style={{background:'#fff',borderRadius:12,border:'1px solid #e8edf5',overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,.05)'}}>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            <thead>
              <tr style={{background:'#f8faff'}}>
                {['Month','Amount Paid','Payment Date','Status','Proof','Recorded At'].map(h=>(
                  <th key={h} style={{padding:'11px 13px',textAlign:'left',color:'#8898b3',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'.5px',whiteSpace:'nowrap'}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {shown.length===0
                ?<tr><td colSpan={6} style={{textAlign:'center',padding:32,color:'#94a3b8',fontSize:13}}>No records.</td></tr>
                :shown.map((p,i)=>(
                  <tr key={p.id} style={{background:i%2===0?'#fff':'#fafbff',borderTop:'1px solid #f1f5f9'}}>
                    <td style={{padding:'10px 13px',fontWeight:600,color:'#0f172a',whiteSpace:'nowrap'}}>{monthLabel(p.year,p.month)}</td>
                    <td style={{padding:'10px 13px',fontWeight:700,color:'#0f172a'}}>{p.payment?fmtTaka(p.payment.paidAmount):'—'}</td>
                    <td style={{padding:'10px 13px',color:'#475569',whiteSpace:'nowrap'}}>{p.payment?.paymentDate?fmtDate(p.payment.paymentDate):'—'}</td>
                    <td style={{padding:'10px 13px'}}><Badge s={p.cs}/></td>
                    <td style={{padding:'10px 13px'}}>
                      {p.payment?.proof
                        ?<button onClick={()=>onProof(p.payment.proof)} style={{background:'none',border:'1px solid #e2e8f0',borderRadius:6,padding:'4px 9px',color:'#2563eb',fontSize:12}}>View</button>
                        :'—'}
                    </td>
                    <td style={{padding:'10px 13px',color:'#475569',fontSize:12,whiteSpace:'nowrap'}}>{p.payment?.recordedAt?fmtDate(p.payment.recordedAt):'—'}</td>
                  </tr>
                ))
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  RECORD PAYMENT (admin quick-entry form)
// ═══════════════════════════════════════════════════════════════
function RecordPayment({rows,updPayment,setSec}){
  const now=new Date();
  const unrecorded=rows.filter(p=>!p.payment);
  const[selId,setSelId]=useState(()=>{
    const c=unrecorded.find(p=>p.year===now.getFullYear()&&p.month===now.getMonth());
    return c?.id||unrecorded[0]?.id||'';
  });
  const[form,setForm]=useState({paymentDate:todayStr(),paidAmount:'14000',note:''});
  const[pf,setPf]=useState(null);
  const[err,setErr]=useState('');
  const[ok,setOk]=useState(false);
  const fRef=useRef();

  const sel=rows.find(p=>p.id===selId);

  const onFile=e=>{
    const f=e.target.files[0];if(!f)return;
    if(!['image/jpeg','image/jpg','image/png','application/pdf'].includes(f.type)){setErr('Only JPG, PNG, or PDF files.');return;}
    if(f.size>5*1024*1024){setErr('Max file size is 5 MB.');return;}
    const r=new FileReader();
    r.onload=ev=>{setPf({name:f.name,type:f.type,dataUrl:ev.target.result});setErr('');};
    r.readAsDataURL(f);
  };

  const submit=()=>{
    setErr('');
    if(!selId){setErr('Select a payment month.');return;}
    if(!form.paymentDate){setErr('Enter payment date.');return;}
    const amt=Number(form.paidAmount);
    if(!amt||amt<=0){setErr('Enter a valid amount.');return;}
    updPayment(selId,p=>({...p,payment:{paymentDate:form.paymentDate,paidAmount:amt,note:form.note,proof:pf,recordedAt:new Date().toISOString()}}));
    setOk(true);
  };

  if(ok)return(
    <div style={{maxWidth:460,textAlign:'center',margin:'0 auto',paddingTop:40}}>
      <div style={{fontSize:54,marginBottom:14}}>✅</div>
      <h3 style={{fontSize:19,fontWeight:800,color:'#0f172a',margin:'0 0 8px'}}>Payment Recorded</h3>
      <p style={{color:'#64748b',fontSize:14}}>The record is saved and visible to everyone.</p>
      <div style={{display:'flex',gap:10,justifyContent:'center',marginTop:16}}>
        <button onClick={()=>{setOk(false);setSec('payments');}} style={{background:'#2563eb',color:'#fff',border:'none',borderRadius:8,padding:'10px 20px',fontSize:14,fontWeight:700}}>View Payments</button>
        <button onClick={()=>{setOk(false);setForm({paymentDate:todayStr(),paidAmount:'14000',note:''});setPf(null);}} style={{background:'#f1f5f9',color:'#374151',border:'none',borderRadius:8,padding:'10px 20px',fontSize:14,fontWeight:600}}>Record Another</button>
      </div>
    </div>
  );

  return(
    <div style={{maxWidth:500}}>
      <h2 style={{fontSize:18,fontWeight:800,color:'#0f172a',marginBottom:6}}>Record Payment</h2>
      <p style={{color:'#64748b',fontSize:13,marginBottom:18}}>Mark a payment as received. This is immediately visible to Shammi.</p>
      {unrecorded.length===0
        ?<div style={{background:'#f0fdf4',borderRadius:12,padding:24,textAlign:'center',color:'#15803d',fontWeight:600,border:'1px solid #86efac'}}>All payments have been recorded. Use Monthly Payments to edit any record.</div>
        :<div style={{background:'#fff',borderRadius:12,border:'1px solid #e8edf5',padding:22,boxShadow:'0 1px 4px rgba(0,0,0,.05)'}}>
          {err&&<div style={{background:'#fef2f2',color:'#dc2626',border:'1px solid #fecaca',borderRadius:8,padding:'9px 13px',fontSize:13,marginBottom:14}}>{err}</div>}

          <div style={{marginBottom:14}}>
            <label style={{fontSize:12,fontWeight:700,color:'#374151',display:'block',marginBottom:5}}>Payment Month</label>
            <select value={selId} onChange={e=>setSelId(e.target.value)}
              style={{width:'100%',border:'1.5px solid #e2e8f0',borderRadius:8,padding:'10px 12px',fontSize:13,background:'#fff',outline:'none',color:'#0f172a'}}>
              <option value="">Select month…</option>
              {unrecorded.map(p=><option key={p.id} value={p.id}>{monthLabel(p.year,p.month)} — {fmtTaka(p.expectedAmount)}</option>)}
            </select>
          </div>

          {sel&&(
            <div style={{background:'#f8faff',borderRadius:8,padding:'9px 13px',marginBottom:14,display:'flex',gap:16,flexWrap:'wrap'}}>
              <div><div style={{fontSize:10,color:'#8898b3',fontWeight:700,textTransform:'uppercase'}}>Amount Due</div><div style={{fontWeight:700,color:'#0f172a'}}>{fmtTaka(sel.expectedAmount)}</div></div>
              <div><div style={{fontSize:10,color:'#8898b3',fontWeight:700,textTransform:'uppercase'}}>Due Date</div><div style={{fontWeight:700,color:'#0f172a'}}>{fmtDate(sel.dueDate)}</div></div>
            </div>
          )}

          <div style={{marginBottom:14}}>
            <label style={{fontSize:12,fontWeight:700,color:'#374151',display:'block',marginBottom:5}}>Payment Date</label>
            <input type="date" value={form.paymentDate} onChange={e=>setForm({...form,paymentDate:e.target.value})}
              style={{width:'100%',border:'1.5px solid #e2e8f0',borderRadius:8,padding:'10px 12px',fontSize:13,outline:'none',color:'#0f172a'}}/>
          </div>

          <div style={{marginBottom:14}}>
            <label style={{fontSize:12,fontWeight:700,color:'#374151',display:'block',marginBottom:5}}>Amount Paid (৳)</label>
            <input type="number" value={form.paidAmount} onChange={e=>setForm({...form,paidAmount:e.target.value})}
              style={{width:'100%',border:'1.5px solid #e2e8f0',borderRadius:8,padding:'10px 12px',fontSize:13,outline:'none',color:'#0f172a'}}/>
          </div>

          <div style={{marginBottom:14}}>
            <label style={{fontSize:12,fontWeight:700,color:'#374151',display:'block',marginBottom:5}}>Payment Proof — optional (JPG, PNG, PDF)</label>
            <div onClick={()=>fRef.current.click()} style={{border:'2px dashed #bfdbfe',borderRadius:10,padding:22,textAlign:'center',cursor:'pointer',background:'#f8faff'}}>
              {pf
                ?<div style={{color:'#15803d',fontWeight:700,fontSize:13}}>✓ {pf.name}</div>
                :<div>
                  <div style={{color:'#2563eb',display:'flex',justifyContent:'center',marginBottom:6}}>{I.up}</div>
                  <div style={{color:'#374151',fontSize:13,fontWeight:600}}>Click to upload proof</div>
                  <div style={{color:'#94a3b8',fontSize:11,marginTop:3}}>JPG, PNG or PDF — max 5 MB</div>
                </div>
              }
            </div>
            <input ref={fRef} type="file" accept=".jpg,.jpeg,.png,.pdf" onChange={onFile} style={{display:'none'}}/>
          </div>

          <div style={{marginBottom:18}}>
            <label style={{fontSize:12,fontWeight:700,color:'#374151',display:'block',marginBottom:5}}>Note (optional)</label>
            <textarea value={form.note} onChange={e=>setForm({...form,note:e.target.value})} rows={2} placeholder="Any notes…"
              style={{width:'100%',border:'1.5px solid #e2e8f0',borderRadius:8,padding:'9px 12px',fontSize:13,resize:'vertical',outline:'none',color:'#0f172a'}}/>
          </div>

          <button onClick={submit} style={{width:'100%',background:'#2563eb',color:'#fff',border:'none',borderRadius:8,padding:12,fontSize:15,fontWeight:700}}>
            Save Payment Record
          </button>
        </div>
      }
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  AGREEMENT DETAILS
// ═══════════════════════════════════════════════════════════════
function AgrDetail({totalMonths}){
  return(
    <div>
      <h2 style={{fontSize:18,fontWeight:800,color:'#0f172a',marginBottom:18}}>Agreement Details</h2>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))',gap:18}}>
        <div style={{background:'#fff',borderRadius:12,border:'1px solid #e8edf5',padding:22,boxShadow:'0 1px 4px rgba(0,0,0,.05)'}}>
          <h3 style={{fontSize:14,fontWeight:700,color:'#0f172a',margin:'0 0 14px'}}>Terms</h3>
          {[['Lender','Rahad'],['Borrower','Shammi'],['Principal',fmtTaka(400000)],['Monthly Interest',fmtTaka(14000)],['Interest Type','Fixed — does not reduce principal'],['Start','13 September 2026'],['End','September 2028'],['Deadline','15th of each month'],['Total Months',String(totalMonths)],['Total Expected',fmtTaka(totalMonths*14000)]].map(([k,v])=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid #f1f5f9',gap:10}}>
              <span style={{color:'#64748b',fontSize:13}}>{k}</span>
              <span style={{color:'#0f172a',fontSize:13,fontWeight:700,textAlign:'right'}}>{v}</span>
            </div>
          ))}
        </div>
        <div style={{background:'#fff',borderRadius:12,border:'1px solid #e8edf5',padding:22,boxShadow:'0 1px 4px rgba(0,0,0,.05)'}}>
          <h3 style={{fontSize:14,fontWeight:700,color:'#0f172a',margin:'0 0 14px'}}>Status Rules</h3>
          {[
            {s:'Received in time',rule:'Payment date ≤ 15th of month'},
            {s:'Received late',rule:'Payment date > 15th of month'},
            {s:'Pending',rule:'No record; deadline not passed'},
            {s:'Missed',rule:'Month ended with no recorded payment'},
          ].map(item=>(
            <div key={item.s} style={{display:'flex',gap:10,alignItems:'center',marginBottom:10,flexWrap:'wrap'}}>
              <Badge s={item.s}/><span style={{color:'#64748b',fontSize:13}}>{item.rule}</span>
            </div>
          ))}
          <div style={{marginTop:18,padding:'14px 16px',background:'#f8faff',borderRadius:10,border:'1px solid #e2e8f0'}}>
            <h4 style={{fontSize:12,fontWeight:700,color:'#0f172a',margin:'0 0 10px'}}>Timeline</h4>
            {[{date:'13 Sep 2026',label:'Agreement started',color:'#2563eb'},{date:'Every month',label:'৳14,000 interest',color:'#7c3aed'},{date:'15th',label:'Payment deadline',color:'#0891b2'},{date:'Sep 2028',label:'Agreement ends',color:'#dc2626'}].map((item,i)=>(
              <div key={i} style={{display:'flex',gap:10,alignItems:'center',marginBottom:8}}>
                <div style={{width:8,height:8,borderRadius:'50%',background:item.color,flexShrink:0}}/>
                <span style={{fontSize:12,color:'#64748b',fontWeight:600,minWidth:70}}>{item.date}</span>
                <span style={{fontSize:12,color:'#0f172a',fontWeight:600}}>{item.label}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  BANK DETAILS
// ═══════════════════════════════════════════════════════════════
function BankSection({bank,isAdmin,onSave}){
  const[editing,setEditing]=useState(false);
  const[form,setForm]=useState({...bank});
  useEffect(()=>{setForm({...bank});},[bank]);
  const fields=[
    {k:'accountName',l:'Account Name'},
    {k:'bankName',l:'Bank Name'},
    {k:'accountNumber',l:'Account Number'},
    {k:'branchName',l:'Branch Name'},
    {k:'routingNumber',l:'Routing Number'},
    {k:'mobileNumber',l:'Mobile Banking Number'},
    {k:'note',l:'Transfer Note',multi:true},
  ];
  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18}}>
        <h2 style={{fontSize:18,fontWeight:800,color:'#0f172a',margin:0}}>Bank Account Details</h2>
        {isAdmin&&!editing&&(
          <button onClick={()=>setEditing(true)} style={{display:'flex',alignItems:'center',gap:6,background:'#2563eb',color:'#fff',border:'none',borderRadius:8,padding:'8px 15px',fontSize:13,fontWeight:700}}>
            {I.edit} Edit
          </button>
        )}
      </div>
      <div style={{background:'#fff',borderRadius:12,border:'1px solid #e8edf5',padding:22,maxWidth:540,boxShadow:'0 1px 4px rgba(0,0,0,.05)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:18,padding:'13px 15px',background:'#eff6ff',borderRadius:10,border:'1px solid #bfdbfe'}}>
          <div style={{width:38,height:38,background:'#2563eb',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',flexShrink:0}}>{I.bank}</div>
          <div>
            <div style={{fontWeight:700,color:'#0f172a',fontSize:15}}>{bank.accountName}</div>
            <div style={{color:'#3b82f6',fontSize:12}}>Receiving Account</div>
          </div>
        </div>
        {!editing
          ?<div>
            {fields.map(({k,l})=>(
              <div key={k} style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid #f1f5f9',gap:12}}>
                <span style={{color:'#64748b',fontSize:13,minWidth:140,flexShrink:0}}>{l}</span>
                <span style={{color:'#0f172a',fontSize:13,fontWeight:700,textAlign:'right',wordBreak:'break-all'}}>{bank[k]||'—'}</span>
              </div>
            ))}
            {!isAdmin&&<p style={{fontSize:12,color:'#94a3b8',marginTop:14,display:'flex',alignItems:'center',gap:5}}>{I.lock} Only Rahad (Tazwaar) can update bank details.</p>}
          </div>
          :<div>
            {fields.map(({k,l,multi})=>(
              <div key={k} style={{marginBottom:13}}>
                <label style={{fontSize:12,fontWeight:700,color:'#374151',display:'block',marginBottom:5}}>{l}</label>
                {multi
                  ?<textarea value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} rows={2} style={{width:'100%',border:'1.5px solid #e2e8f0',borderRadius:8,padding:'9px 12px',fontSize:13,resize:'vertical',outline:'none'}}/>
                  :<input value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} style={{width:'100%',border:'1.5px solid #e2e8f0',borderRadius:8,padding:'9px 12px',fontSize:13,outline:'none'}}/>
                }
              </div>
            ))}
            <div style={{display:'flex',gap:10,marginTop:14}}>
              <button onClick={()=>{onSave(form);setEditing(false);}} style={{flex:1,background:'#2563eb',color:'#fff',border:'none',borderRadius:8,padding:10,fontSize:13,fontWeight:700}}>Save Changes</button>
              <button onClick={()=>{setEditing(false);setForm({...bank});}} style={{flex:1,background:'#f1f5f9',color:'#374151',border:'none',borderRadius:8,padding:10,fontSize:13,fontWeight:600}}>Cancel</button>
            </div>
          </div>
        }
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
